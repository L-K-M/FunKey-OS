name: Docker build environment

# The OS build compiles natively on the runner and never reads docker/, so it is
# filtered out of that workflow. This is what validates the container instead:
# minutes rather than hours, because it stops once the image is built and does
# not go on to compile the OS inside it.
on:
  push:
    branches: [ master ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Builds every layer: the base image has to still be served, apt has to
      # resolve the whole package list, and the clone has to succeed. Those are
      # the three things that have actually broken here.
      - name: Build the container
        run: docker build -t funkey-os-build-env docker/

      # A container that builds but points at the wrong sources is the failure
      # that is easiest to miss, because nothing goes wrong until hours later.
      # Compared against GITHUB_REPOSITORY -- the repository the workflow runs
      # in -- rather than a literal, so this survives a rename, and so a fork
      # running its own CI is told its Dockerfile still clones this repository:
      # the same bug, in someone else's copy. On a fork's pull request back to
      # here, that variable is this repository, and a Dockerfile pointing here
      # is then the correct state, so passing is the right answer and not a
      # missed one. Repointing the ARG default at another fork fails here on
      # purpose; --build-arg is how you build other sources.
      # No -C: the image's WORKDIR is already the clone.
      - name: Check it cloned this repository
        run: |
          remote=$(docker run --rm funkey-os-build-env git remote get-url origin)
          echo "origin:     $remote"
          echo "expected:   $GITHUB_REPOSITORY"
          # Anchored at the end of the URL, with any trailing .git dropped, so a
          # lookalike remote fails rather than passing on a substring: owner/repo
          # also occurs inside owner/repo-mirror and inside the same path on
          # another host. The [/@] before the host is what separates github.com
          # from evilgithub.com while still accepting a token in the URL, and the
          # second pattern is the scp form git@github.com:owner/repo.
          # Both sides are lowercased: GitHub URLs are case-insensitive, so a
          # rename that changed the canonical casing would otherwise fail here
          # against a Dockerfile that is still perfectly correct.
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          case "$(lower "${remote%.git}")" in
            *[/@]github.com/"$(lower "$GITHUB_REPOSITORY")") ;;
            *@github.com:"$(lower "$GITHUB_REPOSITORY")") ;;
            *) echo "::error::container cloned $remote, not $GITHUB_REPOSITORY"; exit 1 ;;
          esac

      # The Makefile is what CMD runs, and Favorites is what this fork adds.
      #
      # Note this inspects what the image cloned, which is the remote's default
      # branch at build time -- not this PR's tree. That is the point: it checks
      # the container is usable, not that the branch is correct. A PR that moved
      # the Favorites collection would not be caught here, and should not be.
      - name: Check the sources look right
        run: |
          # The || clause has to exit 1 itself. A bare "|| echo" would satisfy
          # bash -e and turn the failure green, which is the opposite of the
          # point: this exists to report, in the annotations, what was missing.
          docker run --rm funkey-os-build-env sh -c '
            test -f Makefile &&
            test -d "FunKey/board/funkey/rootfs-overlay/usr/games/collections/Favorites" &&
            echo "Makefile and Favorites collection present"' ||
            { echo "::error::Makefile or the Favorites collection is missing from the cloned sources"; exit 1; }
