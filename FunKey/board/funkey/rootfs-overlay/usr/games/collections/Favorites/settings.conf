###############################################################################
# Favorites is an aggregate menu entry: it owns no ROMs of its own.
#
# Each <System>.sub file in this directory merges that system's games into this
# collection. The games marked as favorites inside each system (press Y on a
# game) are then collected here, so every system's own favorites.txt stays the
# single source of truth and there is no second list to drift out of sync.
#
# Adding support for a new system is one empty "<System>.sub" file here.
###############################################################################

###############################################################################
# List only the favorites, not every game merged in order to find them.
###############################################################################
list.favoritesOnly = true

###############################################################################
# Sort the merged games alphabetically rather than grouping them by system
###############################################################################
list.menuSort = yes

###############################################################################
# No launcher of its own: each game is launched with the launcher of the
# system it belongs to.
###############################################################################
