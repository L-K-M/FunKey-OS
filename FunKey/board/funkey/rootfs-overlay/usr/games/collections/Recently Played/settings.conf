###############################################################################
# Recently Played is an aggregate menu entry: it owns no ROMs of its own.
#
# Each <System>.sub file in this directory merges that system's games into this
# collection, exactly as they are merged into Favorites. The games are then
# narrowed down to the ones named in
#
#     <user path>/collections/Recently Played/recent.txt
#
# which RetroFE rewrites every time a game is launched, newest line first.
#
# Adding support for a new system is one empty "<System>.sub" file here.
###############################################################################

###############################################################################
# List only the recently played games, not every game merged in order to find
# them, and keep them in the order the file gives rather than any other.
###############################################################################
list.recentlyPlayed = true

###############################################################################
# Emphatically not sorted. Alphabetical order would discard the one thing this
# menu records, so menuSort is off here where every other collection has it on.
###############################################################################
list.menuSort = no

###############################################################################
# No launcher of its own: each game is launched with the launcher of the
# system it belongs to.
###############################################################################
